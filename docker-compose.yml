services:
  peer-lp-bot:
    build: .
    container_name: peer-lp-bot
    restart: unless-stopped
    ports:
      - "3200:3200"   # REST API
      - "3100:3100"   # Revolut webhook
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
